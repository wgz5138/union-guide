<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>高榮企業工會 · 成立衝刺</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;background:#fff;color:#1a1a1a;line-height:1.75;-webkit-text-size-adjust:100%}
.hero{background:linear-gradient(160deg,#C0392B 0%,#7B1818 100%);color:#fff;text-align:center;padding:34px 20px 30px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% -20%,rgba(255,255,255,.12),transparent 60%)}
.kick{font-size:13px;letter-spacing:.2em;opacity:.9;position:relative}
.hero h1{font-size:27px;font-weight:800;line-height:1.35;margin:10px 0 8px;position:relative}
.hero .sub{font-size:15px;opacity:.95;position:relative}
.cd{display:flex;justify-content:center;gap:8px;margin:20px 0 8px;position:relative}
.cd .u{background:rgba(0,0,0,.26);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:10px 4px;min-width:62px}
.cd .n{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;display:block}
.cd .l{font-size:11px;opacity:.8;margin-top:4px;display:block}
.dl{font-size:13.5px;opacity:.95;position:relative}.dl b{color:#FFD54F}
.cta{display:block;max-width:380px;margin:20px auto 8px;text-align:center;background:#FFD54F;color:#7B1818;font-size:19px;font-weight:800;padding:16px;border-radius:14px;text-decoration:none;box-shadow:0 8px 24px rgba(255,213,79,.3);position:relative}
.cta:active{transform:scale(.98)}
.safe{font-size:12.5px;opacity:.92;position:relative;margin-top:4px}
.body{max-width:480px;margin:0 auto;padding:24px 20px 48px;text-align:center}
.body .why{font-size:16px;line-height:1.95;color:#333}
.body .why b{color:#C0392B}
.cta2{display:inline-block;margin-top:20px;background:#C0392B;color:#fff;font-size:17px;font-weight:700;padding:14px 30px;border-radius:50px;text-decoration:none}
.cta2:active{background:#7B1818}
.foot{font-size:12px;color:#999;margin-top:26px;line-height:1.7}
</style></head>
<body>
<div class="hero">
  <div class="kick">⏳ 限時邀請</div>
  <h1>這一步，我們想跟你一起走</h1>
  <div class="sub">高榮企業工會 · 成立衝刺　—　就差幾位，希望有你</div>
  <div class="cd">
    <div class="u"><span class="n" id="d">--</span><span class="l">天</span></div>
    <div class="u"><span class="n" id="h">--</span><span class="l">時</span></div>
    <div class="u"><span class="n" id="m">--</span><span class="l">分</span></div>
    <div class="u"><span class="n" id="s">--</span><span class="l">秒</span></div>
  </div>
  <div class="dl">倒數中，這一次真的只有這一次 ｜ <b>6/17（二）23:59 截止</b></div>
  <a class="cta" id="cta" href="#">✋ 我要連署（只要 1 分鐘）</a>
  <div class="safe">連署只是表達意願，受《工會法》§35 保護，名單不會給院方，放心。</div>
</div>

<div class="body">
  <p class="why">30 個人，就能成立屬於我們自己的工會——<br>
  為<b>加班費、排班與權益</b>，跟院方<b>好好談</b>。<br>
  一個人講沒人理，<b>一群人講才有桌子</b>。</p>
  <a class="cta2" id="cta3" href="#">✋ 就是現在，我要連署</a>
  <div class="foot">高榮企業工會（籌備中）· 受邀同仁參考，請勿外傳</div>
</div>

<script>
const FORM_URL = ""; // 報名表單（留白；私用版會填好）
const DEADLINE = "2026-06-17T23:59:59+08:00"; // 台灣時間
["cta","cta3"].forEach(function(id){var a=document.getElementById(id);a.href=FORM_URL||"#";
  if(!FORM_URL)a.onclick=function(){alert("報名連結尚未設定（FORM_URL）");return false}});
function tick(){var diff=new Date(DEADLINE).getTime()-Date.now();if(diff<0)diff=0;
  var d=Math.floor(diff/864e5),h=Math.floor(diff%864e5/36e5),m=Math.floor(diff%36e5/6e4),s=Math.floor(diff%6e4/1e3);
  document.getElementById("d").textContent=d;
  document.getElementById("h").textContent=String(h).padStart(2,"0");
  document.getElementById("m").textContent=String(m).padStart(2,"0");
  document.getElementById("s").textContent=String(s).padStart(2,"0");}
tick();setInterval(tick,1000);
</script>
</body></html>
