<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>身分證影本 加注記工具</title>
<style>
  :root{ --red:#C0392B; --red-deep:#7B1818; --gold:#B7860B; --bg:#F6F3EF; --ink:#222; --soft:#777; --border:#E2DED7; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;}
  .bar{background:var(--red);color:#fff;padding:14px 16px;text-align:center;}
  .bar h1{font-size:18px;font-weight:700;}
  .bar p{font-size:11.5px;opacity:.85;margin-top:2px;}
  main{max-width:560px;margin:0 auto;padding:16px;}
  .card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;}
  label{display:block;font-size:13px;font-weight:600;color:var(--red-deep);margin-bottom:6px;}
  textarea,input[type=text]{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px;font-size:15px;font-family:inherit;}
  textarea{height:62px;resize:vertical;}
  .row{display:flex;gap:10px;align-items:center;margin-top:10px;}
  .row label{margin:0;font-weight:500;color:var(--ink);}
  input[type=range]{flex:1;}
  .btn{display:block;width:100%;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;}
  .btn-pick{background:var(--gold);color:#fff;}
  .btn-save{background:var(--red);color:#fff;margin-top:6px;}
  .btn:disabled{opacity:.4;}
  .hint{font-size:12px;color:var(--soft);margin-top:8px;}
  .safe{background:#EAFAF1;border:1px solid #B8DCC4;color:#1A5C38;font-size:12.5px;padding:10px 12px;border-radius:10px;margin-bottom:14px;}
  #preview{width:100%;border-radius:10px;margin-top:12px;display:none;border:1px solid var(--border);}
  input[type=file]{display:none;}
  select{width:100%;padding:10px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;}
</style>
</head>
<body>
  <div class="bar">
    <h1>🪪 身分證影本 加注記</h1>
    <p>防盜用 · 全程手機本機處理，照片不上傳</p>
  </div>

  <main>
    <div class="safe">🔒 你的證件照片<strong>只在這支手機裡處理</strong>，不會傳到網路或任何伺服器，請安心使用。</div>

    <div class="card">
      <label>1. 注記文字（可改）</label>
      <textarea id="text">本影本僅供「高雄榮民總醫院企業工會」籌組連署使用，他用無效</textarea>
      <div class="row">
        <label>顏色</label>
        <select id="color">
          <option value="#C0392B">紅色（推薦）</option>
          <option value="#1A4FA0">藍色</option>
          <option value="#222222">黑色</option>
        </select>
      </div>
      <div class="row"><label>濃淡</label><input type="range" id="alpha" min="15" max="70" value="38"></div>
      <div class="row"><label>字級</label><input type="range" id="size" min="14" max="44" value="24"></div>
      <div class="hint">浮水印會半透明斜蓋整張，不會完全擋住號碼；送件仍看得清。</div>
    </div>

    <div class="card">
      <label>2. 選身分證照片</label>
      <button class="btn btn-pick" onclick="document.getElementById('file').click()">📷 拍照 / 選照片</button>
      <input type="file" id="file" accept="image/*" capture="environment">
      <img id="preview" alt="預覽">
    </div>

    <button class="btn btn-save" id="save" disabled onclick="save()">⬇ 存成有注記的圖片</button>
    <p class="hint" id="status">尚未選擇照片。</p>
  </main>

<script>
  var canvas = document.createElement('canvas');
  var ctx = canvas.getContext('2d');
  var imgBitmap = null;
  var $ = function(id){ return document.getElementById(id); };

  $('file').addEventListener('change', async function(e){
    var f = e.target.files[0];
    if(!f) return;
    $('status').textContent = '處理中…';
    try{
      // 盡量依 EXIF 自動轉正
      imgBitmap = await createImageBitmap(f, { imageOrientation: 'from-image' });
    }catch(_){
      imgBitmap = await loadFallback(f);
    }
    render();
    $('save').disabled = false;
    $('status').textContent = '完成預覽，按下方存檔即可。';
  });

  function loadFallback(file){
    return new Promise(function(res){
      var img = new Image();
      img.onload = function(){ res(img); };
      img.src = URL.createObjectURL(file);
    });
  }

  ['text','color','alpha','size'].forEach(function(id){
    $(id).addEventListener('input', function(){ if(imgBitmap) render(); });
  });

  function render(){
    var w = imgBitmap.width, h = imgBitmap.height;
    canvas.width = w; canvas.height = h;
    ctx.clearRect(0,0,w,h);
    ctx.drawImage(imgBitmap, 0, 0, w, h);
    drawWatermark(w, h);
    var url = canvas.toDataURL('image/jpeg', 0.92);
    var p = $('preview'); p.src = url; p.style.display = 'block';
  }

  function drawWatermark(w, h){
    var text = ($('text').value || '僅供連署使用').trim();
    var base = Math.min(w, h);
    var fs = Math.max(14, Math.round(base * ($('size').value/600)));
    ctx.save();
    ctx.globalAlpha = $('alpha').value/100;
    ctx.fillStyle = $('color').value;
    ctx.font = 'bold ' + fs + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.translate(w/2, h/2);
    ctx.rotate(-26 * Math.PI/180);
    var diag = Math.sqrt(w*w + h*h);
    var tw = ctx.measureText(text).width;
    var stepX = tw + fs * 2.2;
    var stepY = fs * 3.4;
    for(var y = -diag/2; y < diag/2; y += stepY){
      var offset = (Math.round(y/stepY) % 2) ? stepX/2 : 0;
      for(var x = -diag/2 - stepX; x < diag/2 + stepX; x += stepX){
        ctx.fillText(text, x + offset, y);
      }
    }
    ctx.restore();
  }

  function save(){
    canvas.toBlob(function(blob){
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '身分證影本_已注記_' + Date.now() + '.jpg';
      document.body.appendChild(a); a.click(); a.remove();
      $('status').textContent = '已存檔！手機可長按預覽圖另存，或到下載夾找。';
    }, 'image/jpeg', 0.92);
  }
</script>
</body>
</html>
