<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>（高雄市）高榮企業工會 發起人連署及略歷冊</title>
<style>
  @page{ size:A4 portrait; margin:14mm 12mm; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Noto Serif TC","PMingLiU","新細明體",serif;color:#000;font-size:11pt;background:#fff;}
  .sheet{padding:16px;}
  .head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px;}
  h1{font-size:16pt;font-weight:700;letter-spacing:.03em;}
  .pg{font-size:10pt;white-space:nowrap;}
  .u{display:inline-block;border-bottom:1px solid #000;min-width:34px;text-align:center;}

  table{width:100%;border-collapse:collapse;table-layout:fixed;}
  th,td{border:1px solid #000;padding:4px 3px;text-align:center;vertical-align:middle;font-size:9.5pt;}
  th{background:#eee;font-weight:700;line-height:1.3;}
  td{height:30px;}
  .c-no{width:6%;} .c-nm{width:12%;} .c-id{width:15%;} .c-bd{width:13%;}
  .c-ad{width:24%;} .c-tel{width:13%;} .c-sg{width:11%;} .c-st{width:6%;}
  .tel-cell{padding:0;}
  .tel-cell div{border-bottom:1px solid #ccc;padding:3px 2px;font-size:8pt;text-align:left;}
  .tel-cell div:last-child{border-bottom:none;}
  td.adr{font-size:8pt;}

  .foot{font-size:9.5pt;margin-top:7px;line-height:1.7;}
  .foot b{font-weight:700;}

  .toolbar{position:fixed;top:12px;right:12px;}
  .toolbar button{font-family:sans-serif;font-size:14px;padding:9px 16px;border:none;border-radius:8px;
    background:#C0392B;color:#fff;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2);}
  @media print{ .toolbar{display:none;} .sheet{padding:0;} }
  .pagebreak{page-break-before:always;}
</style>
</head>
<body>
<div class="toolbar"><button onclick="window.print()">🖨 列印 / 存成 PDF</button></div>
<div id="doc"></div>

<script>
function pageHTML(startNo, count, pageNo){
  var rows='';
  for(var i=0;i<count;i++){
    var n=startNo+i;
    rows+='<tr>'+
      '<td class="c-no">'+n+'</td>'+
      '<td class="c-nm"></td>'+
      '<td class="c-id"></td>'+
      '<td class="c-bd"></td>'+
      '<td class="c-ad adr"></td>'+
      '<td class="c-tel tel-cell"><div>（公）</div><div>（手機）</div></td>'+
      '<td class="c-sg"></td>'+
      '<td class="c-st"></td>'+
    '</tr>';
  }
  return ''+
  '<div class="sheet">'+
    '<div class="head">'+
      '<h1>（高雄市）高榮企業工會　發起人連署及略歷冊</h1>'+
      '<div class="pg">第 <span class="u">'+pageNo+'</span> 頁／共 <span class="u">　</span> 頁</div>'+
    '</div>'+
    '<table>'+
      '<thead><tr>'+
        '<th class="c-no">編號</th>'+
        '<th class="c-nm">姓名</th>'+
        '<th class="c-id">身分證字號</th>'+
        '<th class="c-bd">出生年月日</th>'+
        '<th class="c-ad">通信地址</th>'+
        '<th class="c-tel">聯絡電話</th>'+
        '<th class="c-sg">發起連署簽名</th>'+
        '<th class="c-st">蓋章</th>'+
      '</tr></thead>'+
      '<tbody>'+rows+'</tbody>'+
    '</table>'+
    '<div class="foot">'+
      '依《工會法》第 11 條規定，發起人數須達 <b>30 人以上</b>，發起人應<b>親自分別簽名及蓋章</b>。'+
      '（代表雇主行使管理權之主管人員不得為發起人）<br>'+
      '本表格不敷使用時請自行影印重複使用。　籌備聯絡人：<span class="u" style="min-width:120px"></span>'+
      '　電話/Line：<span class="u" style="min-width:150px"></span>'+
    '</div>'+
  '</div>';
}

// 第1頁 1-15，第2頁 16-30；不夠再影印
var doc=document.getElementById('doc');
doc.innerHTML =
  pageHTML(1,15,1) +
  '<div class="pagebreak"></div>' +
  pageHTML(16,15,2);
</script>
</body>
</html>
