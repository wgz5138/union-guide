name: deploy-pages

# 把整個 repo（根目錄）自動發佈到 GitHub Pages。
# 每次 push 到 main 就自動部署；也可手動 Run workflow。
# 用 configure-pages 的 enablement: true 直接「啟用」Pages，不必到 Settings 手動開。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，新的不取消進行中的（避免半途中斷）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 設定並啟用 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: 打包整個網站（排除 .git）
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
